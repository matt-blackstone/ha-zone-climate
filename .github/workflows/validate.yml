# Validates the integration against both:
#   1. HACS (custom-integration store rules: hacs.json shape, repository
#      structure, manifest version field, brand image presence, etc.)
#   2. hassfest (Home Assistant Core's official integration validator:
#      manifest schema, services.yaml shape, translation key surface,
#      dependency graph, IoT class, etc.)
#
# Both are the de-facto standard pair for a custom HA integration repo.
# The nightly schedule catches regressions in HACS / HA Core's rules
# themselves (e.g. a new manifest field becoming required) without
# needing a code change to trigger.
#
# The HACS ``brands`` check is satisfied by the local
# ``custom_components/multisplit_zone_controller/icon.png`` asset.
# When the integration is later registered upstream in
# home-assistant/brands, the local asset becomes redundant but
# remains harmless.
name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # We invoke the hassfest docker image directly rather than via the
      # ``home-assistant/actions/hassfest@master`` wrapper because the
      # wrapper mounts the entire workspace, which causes hassfest to
      # auto-discover every ``manifest.json`` it can find — including
      # the test-only ``recording_climate`` fake under
      # ``tests/integration/``. Mounting *only* ``custom_components/``
      # constrains discovery to the published integration. Result is
      # equivalent to what the action does, just scoped correctly.
      - name: Hassfest validation (custom_components/ only)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/custom_components":/github/workspace/custom_components:ro \
            ghcr.io/home-assistant/hassfest:latest
